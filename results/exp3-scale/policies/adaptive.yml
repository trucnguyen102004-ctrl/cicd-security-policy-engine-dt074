# Proposed Adaptive Security Gate policy (DT074).
# Each mechanism can be switched off independently for the ablation study
# (see policy/ablation/*.yml, generated by scripts/run_experiment.py).
version: 1
name: adaptive

scope:
  # Differential scanning: only files changed between --base and --head.
  differential: true
  include: ["**"]
  exclude:
    - "dataset/**"          # evaluation fixtures (intentionally vulnerable)
    - "results/**"
    - "**/test/**"
    - "**/tests/**"
    - "**/*.md"
  dependency_manifests:
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/Pipfile.lock"
    - "**/poetry.lock"
    - "**/pom.xml"
    - "**/build.gradle"
    - "**/build.gradle.kts"
    - "**/gradle.lockfile"

sast:
  # Language-aware rule selection: a pack is loaded only if the change touches
  # one of its languages (rule parsing dominates Semgrep start-up time).
  language_aware: true
  configs:
    - {path: "{registry}/p-java.yml", languages: [java]}
    - {path: "{registry}/p-python.yml", languages: [python]}
    - {path: "{registry}/p-secrets.yml"}
    - {path: "{gate}/rules/custom/java-taint.yml", languages: [java]}
    - {path: "{gate}/rules/custom/java-hardcoded.yml", languages: [java]}
    - {path: "{gate}/rules/custom/python-taint.yml", languages: [python]}
    - {path: "{gate}/rules/custom/python-secrets.yml", languages: [python]}
  # OWASP Risk Rating: overall severity = f(likelihood, impact).
  block_at: HIGH             # block only HIGH / CRITICAL overall risk
  min_confidence: MEDIUM     # LOW-confidence rules are advisory
  audit_blocks: false        # 'audit' subcategory rules are advisory
  sanitizer_triage: true     # finding line calls a known sanitiser -> advisory
  sanitizers:
    python: ['\bescape\(', '\bhtml\.escape\(', '\bsecure_filename\(', '\bsafe_join\(',
             '\bjsonify\(', '\bbleach\.clean\(', '\brender_template\(']
    java: ['\bEncode\.for\w+\(', '\bescapeHtml4?\(', '\bencodeForHTML\(', '\bhtmlEscape\(',
           '\bsetString\(', '\bFilenameUtils\.getName\(']

secrets:
  block: true                # any verified secret in changed commits blocks
  allow_paths: []

sca:
  only_new_components: true  # vulns already present at --base are advisory
  always_block: [CRITICAL]
  block_at: HIGH             # HIGH blocks only if a fix exists and the package is imported
  require_fix_available: true
  require_reachable: true
  python_import_names:
    pyyaml: [yaml]
    pillow: [PIL]
    beautifulsoup4: [bs4]
    scikit-learn: [sklearn]
    opencv-python: [cv2]
    python-dateutil: [dateutil]
    pyjwt: [jwt]
    psycopg2-binary: [psycopg2]
    protobuf: [google.protobuf]

sbom:
  format: cyclonedx-json
  only_on_manifest_change: true

feedback:
  markdown: SECURITY_GATE_FEEDBACK.md
  max_advisories: 25
  context_lines: 2

override:
  enabled: true
  min_reason_length: 15      # GATE_OVERRIDE_REASON must explain the emergency
