# DT074: hard-coded secrets assigned to credential-named variables (CWE-798).
# The Shannon-entropy check removes low-entropy constants such as header names.
rules:
  - id: dt074.python.secrets.hardcoded-credential-variable
    languages: [python]
    severity: ERROR
    message: >-
      '$NAME' is assigned a high-entropy string literal that looks like a
      credential. Read it from os.environ or a secret manager and rotate it.
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      category: security
      subcategory: [vuln]
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      remediation_key: CWE-798
    patterns:
      - pattern-either:
          - pattern: $NAME = "$VALUE"
          - pattern: $OBJ.$NAME = "$VALUE"
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(secret|passw(or)?d|pwd|api_?key|access_?key|private_?key|token|signing_?key).*
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^.{12,}$
      - metavariable-analysis:
          analyzer: entropy
          metavariable: $VALUE
