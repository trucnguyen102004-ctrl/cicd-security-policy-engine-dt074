# DT074 custom rules: hard-coded credentials in Java credential/crypto APIs
# (CWE-798 family: CWE-259 password, CWE-321 key). Sink list follows the JAAS /
# JCA credential constructors covered by find-sec-bugs HARD_CODE_PASSWORD/KEY.
# Semgrep constant propagation lets "..." match a local variable whose only
# reaching value is a string literal.
rules:
  - id: dt074.java.secrets.hardcoded-credential
    languages: [java]
    severity: ERROR
    message: >-
      A string literal is used as a credential or cryptographic key. Load it at
      runtime from a secret manager or environment variable and rotate the
      exposed value.
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      remediation_key: CWE-798
    pattern-either:
      - pattern: DriverManager.getConnection($URL, $USER, "...")
      - pattern: java.sql.DriverManager.getConnection($URL, $USER, "...")
      - pattern: new PasswordAuthentication($USER, "...".toCharArray())
      - pattern: new java.net.PasswordAuthentication($USER, "...".toCharArray())
      - pattern: new javax.security.auth.kerberos.KerberosKey($P, "...".toCharArray(), ...)
      - pattern: new KerberosKey($P, "...".toCharArray(), ...)
      - pattern: new PBEKeySpec("...".toCharArray(), ...)
      - pattern: new SecretKeySpec("...".getBytes(...), ...)
      - pattern: new javax.crypto.spec.SecretKeySpec("...".getBytes(...), ...)
