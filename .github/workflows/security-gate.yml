name: security-gate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"          # weekly full scan: catches CVEs published after merge
  workflow_dispatch:
    inputs:
      mode:
        description: adaptive or baseline
        default: adaptive
        type: choice
        options: [adaptive, baseline]

permissions:
  contents: read
  pull-requests: write           # feedback comment
  security-events: write         # SARIF upload

concurrency:
  group: security-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Adaptive security gate
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # full history: needed for git diff and gitleaks commit range
      - name: DT074 security gate
        id: gate
        uses: ./                  # the reusable action defined in action.yml
        with:
          mode: ${{ inputs.mode || 'adaptive' }}
          upload-sarif: "true"
      - name: Notify chat on block
        if: failure() && steps.gate.outputs.decision == 'BLOCK'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 gate/notify.py --results .gate-out --run-url "$RUN_URL"

  debt-report:
    name: Weekly full-repository scan (non-blocking)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./
        with:
          mode: baseline
          fail-on-block: "false"
          comment-on-pr: "false"
